name: Release Nitrite Bridge

# Push release tags **three at a time at most**. GitHub creates no tag events at
# all for a push carrying more than three tags — not the fourth onward, all of
# them — so a batched `git push origin tagA tagB ... tagF` silently publishes
# nothing and reports no failure. `workflow_dispatch` below is the way back when
# it happens anyway; without it the only recovery is deleting and re-pushing the
# tag.
#
# **A package's first version cannot come from here.** pub.dev's automated
# publishing is configured on a package's admin page, which does not exist until
# the package does, so version one is published by hand with `dart pub publish`
# and the tag pushed afterwards — which makes this workflow's first run fail with
# "already exists". That is expected once, for the first release only.

on:
  push:
    tags:
      - 'nitrite_bridge-[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

jobs:
  publish:
    name: Publish on pub.dev
    runs-on: ubuntu-latest

    permissions:
      id-token: write # Required for authentication using OIDC
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.12.0
        with:
          channel: 'stable'

      # This action adds a token needed for pub.dev authentication
      - name: Install Dart
        uses: dart-lang/setup-dart@v1.8.0
        with:
          sdk: stable

      - name: Setup Build System
        shell: bash
        run: |
          chmod +x ./.github/workflows/scripts/install-tools.sh
          ./.github/workflows/scripts/install-tools.sh

      - name: Generate Code
        run: melos run generate

      - name: Format Nitrite
        run: melos run lint:all

      - name: Publish Nitrite Bridge
        uses: nick-fields/retry@v4
        with:
          max_attempts: 10
          timeout_minutes: 60
          command: |
            cd packages/nitrite_bridge
            flutter pub publish --force