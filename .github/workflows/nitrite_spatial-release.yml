name: Release Nitrite Spatial

# Push release tags **three at a time at most**. GitHub creates no tag events at
# all for a push carrying more than three tags — not the fourth onward, all of
# them — so a batched `git push origin tagA tagB ... tagF` silently publishes
# nothing and reports no failure. `workflow_dispatch` below is the way back when
# it happens anyway; without it the only recovery is deleting and re-pushing the
# tag.

on:
  push:
    tags:
      - 'nitrite_spatial-[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

jobs:
  publish:
    name: Publish on pub.dev
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      id-token: write # Required for authentication using OIDC
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.12.0
        with:
          channel: 'stable'

      # This action adds a token needed for pub.dev authentication
      - name: Install Dart
        uses: dart-lang/setup-dart@v1.8.1
        with:
          sdk: stable

      - name: Setup Build System
        shell: bash
        run: |
          chmod +x ./.github/workflows/scripts/install-tools.sh
          ./.github/workflows/scripts/install-tools.sh

      - name: Generate Code
        run: melos run generate

      - name: Format Nitrite
        run: melos run lint:all

      # `dart pub publish` answers "already exists" for a version that is up,
      # and that is a permanent failure the retry below would nonetheless
      # attempt ten times. It happens whenever a tag is re-pushed, or when a
      # package's first version had to be published by hand — which is how
      # every first release works, because pub.dev configures automated
      # publishing on a page that does not exist until the package does.
      - name: Is nitrite_spatial already published?
        id: published
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: *//p' packages/nitrite_spatial/pubspec.yaml | head -1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if curl -sfo /dev/null \
               "https://pub.dev/api/packages/nitrite_spatial/versions/$version"; then
            echo "nitrite_spatial $version is already on pub.dev"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish Nitrite Spatial
        if: steps.published.outputs.skip == 'false'
        uses: nick-fields/retry@v4
        with:
          max_attempts: 10
          timeout_minutes: 60
          command: |
            cd packages/nitrite_spatial
            flutter pub publish --force