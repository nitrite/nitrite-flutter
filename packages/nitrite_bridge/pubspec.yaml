name: nitrite_bridge
description: Inspect the embedded databases inside your running Dart or Flutter application from a desktop client, over a paired, loopback-by-default connection.
version: 0.1.0
homepage: https://nitrite.dizitart.com/
repository: https://github.com/nitrite/nitrite-flutter

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  nitrite: ^2.0.4
  logging: ^1.2.0
  # Pure Dart, no Flutter plugin: lets SqfliteAdapter be written against
  # DatabaseExecutor and unit-tested against real SQLite via sqflite_common_ffi.
  sqflite_common: ^2.5.11

dev_dependencies:
  flutter:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.24.6
  sqflite_common_ffi: ^2.3.4

funding:
  - https://github.com/sponsors/anidotnet

resolution: workspace
