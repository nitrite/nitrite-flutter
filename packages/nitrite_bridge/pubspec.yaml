name: nitrite_bridge
description: Inspect a running application's Nitrite database from a desktop client, over a paired, loopback-by-default connection.
version: 0.1.0
homepage: https://nitrite.dizitart.com/
repository: https://github.com/nitrite/nitrite-flutter

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  nitrite: ^3.0.0
  dbinspect_bridge: ^0.1.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.24.6

funding:
  - https://github.com/sponsors/anidotnet

# Not on pub.dev until the dbinspect release, so this resolves through the
# sibling checkout until then — which is why this package is deliberately out of
# the workspace in the root `pubspec.yaml`. `dart pub publish` ignores overrides.
#
# Remove this the day `dbinspect_bridge` is published.
dependency_overrides:
  dbinspect_bridge:
    path: ../../../../fanlight/dbinspect/dart/dbinspect_bridge
  # Out of the workspace, `nitrite` would otherwise come from pub.dev and the
  # tests would run against the published core rather than the one beside them.
  nitrite:
    path: ../nitrite
